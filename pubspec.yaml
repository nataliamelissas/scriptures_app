name: scriptures_app
description: "A beautiful LDS scripture reading app with study projects"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  http: ^1.2.2

  # Local Storage (Drift = type-safe SQLite)
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true
